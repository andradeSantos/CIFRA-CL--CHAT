services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-cla
    environment:
      POSTGRES_DB: cla_db
      POSTGRES_USER: cla_user
      POSTGRES_PASSWORD: cla_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata_cla:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cla_user -d cla_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: api-cla
    environment:
      DATABASE_URL: postgresql://cla_user:cla_pass@postgres:5432/cla_db
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      NODE_ENV: development
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:10022}
    ports:
      - "${API_PORT:-10023}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://api:3001
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:10023}
    container_name: web-cla
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:10023}
    ports:
      - "${WEB_PORT:-10022}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  prisma-studio:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: prisma-studio-cla
    environment:
      DATABASE_URL: postgresql://cla_user:cla_pass@postgres:5432/cla_db
    ports:
      - "${PRISMA_STUDIO_PORT:-5555}:5555"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "@cifra/api", "exec", "prisma", "studio", "--port", "5555", "--browser", "none"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5555').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata_cla:
